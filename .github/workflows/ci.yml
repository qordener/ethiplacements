name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # Suit .nvmrc : la CI teste la version de référence du projet.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Generate Prisma client
        run: npx nx run api:prisma-generate

      # Rejoue l'installation telle que décrite par le README, depuis un état
      # vierge : c'est ce qui manquait pour détecter que la commande échouait
      # faute de DATABASE_URL.
      - name: Verify a fresh clone can create its database
        run: npx nx run api:prisma-migrate

      - name: Lint
        run: npx nx run-many -t lint --projects=api,dashboard

      - name: Test
        run: npx nx run-many -t test --projects=api,dashboard

      - name: Build
        run: npx nx run-many -t build --projects=api,dashboard
